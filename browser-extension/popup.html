<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>需求采集助手</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', sans-serif;
      font-size: 13px;
      color: #18181b;
      background: #fafafb;
    }
    h1 { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
    .sub { font-size: 11px; color: #a1a1aa; margin-bottom: 12px; }
    .card {
      background: #fff;
      border: 1px solid #ececf0;
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .stat { display: flex; align-items: baseline; gap: 6px; }
    .stat b { font-size: 22px; font-weight: 600; }
    .stat span { font-size: 11px; color: #a1a1aa; }
    .ok { color: #10b981; }
    .err { color: #ef4444; }
    .list { max-height: 200px; overflow-y: auto; }
    .item {
      padding: 7px 0;
      border-bottom: 1px solid #f4f4f5;
      font-size: 12px;
      line-height: 1.45;
    }
    .item:last-child { border-bottom: none; }
    .item .m { color: #a1a1aa; font-size: 10px; margin-top: 2px; }
    .note {
      font-size: 10px;
      color: #a1a1aa;
      line-height: 1.6;
      padding: 10px 12px;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      margin-top: 4px;
    }
    button.link {
      background: none;
      border: none;
      color: #7c3aed;
      font-size: 11px;
      cursor: pointer;
      padding: 4px 0;
    }
  </style>
</head>
<body>
  <h1>需求采集助手</h1>
  <div class="sub">在你正在浏览的页面点右下角「采集」按钮即可存入</div>

  <div class="card">
    <div class="stat">
      <b id="cnt">–</b><span>条已采集</span>
      <span id="conn" style="margin-left:auto"></span>
    </div>
  </div>

  <div class="card">
    <div style="font-size:12px;font-weight:500;margin-bottom:6px">最近采集</div>
    <div class="list" id="list"><div class="item" style="color:#a1a1aa">加载中…</div></div>
  </div>

  <div class="note">
    <b>合规边界</b>：采集只在你点击时发生，不自动抓取；只读页面已渲染的内容，
    不绕过验证；<b>不采集用户昵称/头像等可识别信息</b>。
  </div>

  <button class="link" id="open">打开工作台 →</button>

  <script src="popup.js"></script>
</body>
</html>
